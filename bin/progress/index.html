<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>專案總覽 · Agent Handoff Kit</title><link rel="icon" href="agent-handoff-kit-logo2-256.png"><link rel="stylesheet" href="styles.css"><script src="renderer.js" defer></script></head>
<body>
<a class="skip" href="#main" data-i18n="skip">跳到內容</a>
<header class="brandbar"><a class="brand" href="#overview"><img src="agent-handoff-kit-logo2-256.png" alt="" width="48" height="48"><span class="brand-label"><span>Agent Handoff Kit</span><small id="kit-version" class="kit-version"></small></span></a><nav aria-label="主要頁面 / Main navigation"><a href="#overview" data-view="overview" data-i18n="overview">總覽</a><a href="#history" data-view="history" data-i18n="history">歷程</a><a href="#documents" data-view="documents" data-i18n="documents">文件地圖</a></nav><div class="tools"><span id="sync" role="status"></span><select id="language" aria-label="介面語言 / Interface language"><option value="zh-Hant">繁中</option><option value="en">English</option></select></div></header>
<main id="main">
 <p id="warning" class="warning" hidden role="status"></p>
 <section id="overview-view" class="view" aria-labelledby="project-title">
  <header class="project"><div class="project-copy"><p class="eyebrow" data-i18n="project">專案工作總覽</p><h1 id="project-title"></h1></div><img class="project-art" src="dashboard-hero.png" width="1536" height="1024" alt="" decoding="async"><div class="project-meta"><button id="freshness" class="quiet" data-action="sources"></button><button id="recorded-current" class="recorded-current quiet" data-document="handoff"></button></div></header>
  <p id="empty" class="empty" hidden data-i18n="empty"></p>
  <section class="journey" aria-labelledby="journey-title"><h2 id="journey-title" class="journey-label" data-i18n="workstreams">工作主線</h2><p id="work-scope" class="scope-note" hidden></p><div id="work-route" class="work-route"></div><button id="more-work" class="text-link" hidden data-action="all-work"></button><div id="focus" class="focus-panel"></div></section>
  <div class="overview-grid">
   <section class="panel recent-panel"><header class="section-heading"><h2><svg aria-hidden="true"><use href="icons.svg#clock"></use></svg><span data-i18n="recent">最近變更</span></h2><a href="#history" class="text-link" data-i18n="viewHistory">查看歷程</a></header><div id="recent-list" class="recent-list"></div></section>
   <section class="panel outstanding-panel"><header class="section-heading"><h2><svg aria-hidden="true"><use href="icons.svg#check"></use></svg><span data-i18n="outstanding">待辦事項</span></h2><button data-action="all-work" class="text-link" data-i18n="allWork">全部工作</button></header><div class="pending-columns"><div id="pending-list"></div><div class="results"><h3 data-i18n="results">成果與參考</h3><div id="result-list"></div></div></div></section>
  </div>
  <section class="document-strip panel"><div class="strip-intro"><h2 data-i18n="documentRelations">文件關係</h2><p data-i18n="documentIntro">從目前交接，找回紀錄與依據。</p></div><div id="document-strip"></div><a href="#documents" class="text-link" data-i18n="viewMap">查看地圖</a></section>
 </section>
 <section id="history-view" class="view" hidden aria-labelledby="history-title"><header class="view-header"><div><p class="eyebrow" id="history-project"></p><h1 id="history-title" data-i18n="projectHistory">專案歷程</h1><p data-i18n="historyIntro">找回每次改變與交接的脈絡。</p></div></header>
  <form id="history-filter" class="filterbar"><div class="segmented"><button type="button" data-days="7" data-i18n="last7">近7日</button><button type="button" data-days="30" data-i18n="last30">近30日</button><button type="button" data-days="all" data-i18n="allDates">全部日期</button></div><label><span data-i18n="from">由</span><input id="from" type="date"></label><label><span data-i18n="to">至</span><input id="to" type="date"></label><label><select id="history-work" aria-label="工作線 / Workstream"></select></label><label class="search-label"><svg aria-hidden="true"><use href="icons.svg#search"></use></svg><input id="search" type="search" maxlength="100" data-placeholder="search" aria-label="查找紀錄 / Search records"></label><button class="primary" type="submit" data-i18n="apply">查看</button></form>
  <p class="scope-note" data-i18n="dateBoundary">日期只篩選歷程，目前未完事項不受影響。</p><div id="history-status" class="scope-note" role="status"></div><div id="history-list" class="timeline"></div><button id="history-more" class="secondary" hidden data-i18n="loadMore">載入更多紀錄</button>
 </section>
 <section id="documents-view" class="view" hidden aria-labelledby="documents-title"><header class="view-header"><div><p class="eyebrow" id="documents-project"></p><h1 id="documents-title" data-i18n="documentsHeading">文件各司其職</h1><p data-i18n="documentsIntro">點選文件，查看用途、來源與相關紀錄。</p></div><div class="segmented"><button id="map-mode" aria-pressed="true" data-i18n="map">地圖</button><button id="list-mode" aria-pressed="false" data-i18n="list">清單</button></div></header><p id="document-status" class="scope-note"></p><div id="document-map" class="document-map"></div><div id="map-detail" class="map-detail panel"></div><div id="document-list" class="document-list" hidden></div><p class="scope-note" data-i18n="mapBoundary">連線表示已記錄的文件角色或關係；不代表已驗收。</p></section>
 <footer>
  <div class="footer-note"><p data-i18n="boundary">依已保存紀錄更新；未保存的工作不會出現在這裏。</p><button class="quiet" data-action="sources" data-i18n="sources">資料依據</button></div>
  <div class="footer-credit"><div class="creator"><span data-i18n="creatorRole">作者｜AI 生活策展人</span><strong>Adam Chan</strong></div><div class="creator-links" role="group" aria-label="作者與專案 / Creator and project"><a class="creator-link" href="https://www.facebook.com/chan.adam" target="_blank" rel="noopener noreferrer">Facebook</a><a class="creator-link" href="https://github.com/Adamchanadam/agent-handoff-kit" target="_blank" rel="noopener noreferrer">Agent Handoff Kit · GitHub</a></div></div>
 </footer>
 <noscript><p class="warning">請啟用 JavaScript 以讀取紀錄。 / Please enable JavaScript to load records.</p></noscript>
</main>
<dialog id="drawer" aria-labelledby="drawer-title"><header><div><p id="drawer-kicker" class="eyebrow"></p><h2 id="drawer-title"></h2></div><button id="close" class="icon-button" aria-label="關閉 / Close"><svg aria-hidden="true"><use href="icons.svg#close"></use></svg></button></header><div id="drawer-content"></div></dialog><div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body></html>
